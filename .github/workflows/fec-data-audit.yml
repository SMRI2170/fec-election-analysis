name: FEC source audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/sources/**'
      - 'scripts/download_fec.py'
      - 'scripts/audit_fec_workbook.py'
      - 'scripts/normalize_fec.py'
      - 'scripts/analyze.py'
      - 'scripts/run_backtests.py'
      - 'scripts/run_sensitivity.py'
      - 'scripts/error_cases.py'
      - 'scripts/plot_results.py'
      - 'scripts/source_reconcile.py'
      - 'scripts/paired_accuracy.py'
      - 'scripts/audit_primary_subtotals.py'
      - '.github/workflows/fec-data-audit.yml'

permissions:
  contents: read

concurrency:
  group: fec-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Download 2020 and 2022 primary source workbooks
        run: python scripts/download_fec.py --years 2016 2018 2020 2022
      - name: Inventory 2016 workbook sheets
        run: python scripts/audit_fec_workbook.py data/raw/federalelections2016.xlsx --max-sheets 1 --rows 12 --sheet-contains "House Results" --output data/raw/fec2016-audit.json
      - name: Inventory 2018 workbook sheets
        run: python scripts/audit_fec_workbook.py data/raw/federalelections2018.xlsx --max-sheets 1 --rows 12 --sheet-contains "House Results" --output data/raw/fec2018-audit.json
      - name: Inspect 2020 first sheets
        run: python scripts/audit_fec_workbook.py data/raw/federalelections2020.xlsx --max-sheets 2 --rows 18 --sheet-contains "House Results" --output data/raw/fec2020-audit.json
      - name: Inspect 2022 first sheets
        run: python scripts/audit_fec_workbook.py data/raw/federalelections2022.xlsx --max-sheets 2 --rows 18 --sheet-contains "House Results" --output data/raw/fec2022-audit.json
      - name: Normalize conservative 2016-2022 House subset
        run: python scripts/normalize_fec.py --years 2016 2018 2020 2022
      - name: Validate normalized data against a known FEC example
        run: |
          python - <<'PY'
          import pandas as pd
          d = pd.read_csv('data/processed/elections.csv', dtype={'district': str})
          subset = d[(d.year == 2020) & (d.state == 'AL') & (d.district == '01')]
          assert len(subset) == 1, f'AL-01 missing/duplicated: {len(subset)}'
          row = subset.iloc[0]
          expected = (99469, 52103, 211825, 116949)
          actual = tuple(int(row[c]) for c in ['primary_rep_votes', 'primary_dem_votes', 'general_rep_votes', 'general_dem_votes'])
          assert actual == expected, f'FEC AL-01 discrepancy: {actual} != {expected}'
          print('FEC 2020 Alabama House district 01 reconciliation succeeded')
          PY
      - name: Evaluate rolling out-of-year backtests
        run: python scripts/run_backtests.py --input data/processed/elections.csv --test-years 2018 2020 2022 --output data/processed/backtest_metrics.csv
      - name: Evaluate sample selection sensitivity
        run: python scripts/run_sensitivity.py --input data/processed/elections.csv --test-year 2022
      - name: Report the largest 2022 prediction errors
        run: python scripts/error_cases.py --input data/processed/elections.csv --test-year 2022
      - name: Inspect every excluded primary subtotal discrepancy
        run: python scripts/audit_primary_subtotals.py
      - name: Verify model error difference on paired 2022 contests
        run: python scripts/paired_accuracy.py
      - name: Reconcile all selected records against original FEC district totals
        run: python scripts/source_reconcile.py
      - name: Produce reproducible report figures
        run: python scripts/plot_results.py --input data/processed/elections.csv --metrics data/processed/backtest_metrics.csv --test-year 2022
      - name: Publish only small audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fec-source-layout-check
          path: |
            data/raw/download-manifest.json
            data/raw/fec2016-audit.json
            data/raw/fec2018-audit.json
            data/raw/fec2020-audit.json
            data/raw/fec2022-audit.json
            data/processed/normalization-summary.json
            data/processed/backtest_metrics.csv
            data/processed/sensitivity_metrics.csv
            data/processed/errors_2022.csv
            data/processed/paired-accuracy.json
            data/processed/case-evidence.json
            data/processed/source-reconciliation.csv
            data/processed/primary-subtotal-differences.csv
            data/processed/primary-subtotal-summary.json
            data/processed/primary-subtotal-examples.json
            outputs/figures/*.png
          if-no-files-found: ignore
          retention-days: 3
