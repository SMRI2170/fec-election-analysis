name: FEC source audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/sources/**'
      - 'scripts/download_fec.py'
      - 'scripts/audit_fec_workbook.py'
      - '.github/workflows/fec-data-audit.yml'

permissions:
  contents: read

concurrency:
  group: fec-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Download 2020 and 2022 primary source workbooks
        run: python scripts/download_fec.py --years 2020 2022
      - name: Inspect 2020 first sheets
        run: python scripts/audit_fec_workbook.py data/raw/federalelections2020.xlsx --max-sheets 2 --rows 18 --sheet-contains "House Results" --output data/raw/fec2020-audit.json
      - name: Inspect 2022 first sheets
        run: python scripts/audit_fec_workbook.py data/raw/federalelections2022.xlsx --max-sheets 2 --rows 18 --sheet-contains "House Results" --output data/raw/fec2022-audit.json
      - name: Publish only small audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fec-source-layout-check
          path: |
            data/raw/download-manifest.json
            data/raw/fec2020-audit.json
            data/raw/fec2022-audit.json
          if-no-files-found: ignore
          retention-days: 3
