name: FEC Frozen 2024 evaluation protocol

on:
  pull_request:
    paths:
      - scripts/frozen_2024_protocol.py
      - configs/frozen-2024-evaluation.json
      - tests/test_frozen_2024_protocol.py
      - docs/2024-frozen-evaluation-protocol.md
      - data/sources/fec_publications.json
      - .github/workflows/frozen-2024-protocol.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-2024-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The freeze commit has to be reachable, so the whole history is needed.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Unit tests of the frozen plan
        run: python -m pytest -q tests/test_frozen_2024_protocol.py
      - name: Check that the note, the configuration and the freeze commit agree
        run: python scripts/frozen_2024_protocol.py --check
