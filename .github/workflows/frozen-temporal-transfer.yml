name: FEC frozen temporal transfer

on:
  pull_request:
    paths:
      - scripts/evaluate_frozen_temporal_transfer.py
      - tests/test_frozen_temporal_transfer.py
      - docs/frozen-temporal-transfer.md
      - .github/workflows/frozen-temporal-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-temporal-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Synthetic tests of the frozen training set and the paired comparison
        run: python -m pytest -q tests/test_frozen_temporal_transfer.py
      - name: Download official FEC 2016-2022 House Excel sources
        run: python scripts/download_fec.py --years 2016 2018 2020 2022
      - name: Normalize fixed 916 voting-House contests
        run: python scripts/normalize_fec.py --years 2016 2018 2020 2022 --writein-policy attribute
      - name: Verify frozen cohort, baseline metrics and source hashes
        run: |
          python scripts/run_backtests.py --input data/processed/elections.csv --test-years 2018 2020 2022
          python scripts/verify_reproducibility.py
      - name: Apply the frozen model and compare with the baseline on the same contests
        run: python scripts/evaluate_frozen_temporal_transfer.py --assert-baseline
      - name: Save short-lived numerical findings
        uses: actions/upload-artifact@v4
        with:
          name: fec-frozen-temporal-transfer
          path: |
            data/processed/frozen_transfer/frozen_temporal_transfer.csv
            data/processed/frozen_transfer/frozen_temporal_transfer_paired.csv
            data/processed/frozen_transfer/frozen_temporal_transfer_districts.csv
            data/processed/frozen_transfer/frozen_temporal_transfer.json
          retention-days: 7
