name: NH-01 official Democratic primary crosscheck

on:
  pull_request:
    paths:
      - data/sources/nh01_2022_democratic_primary.json
      - scripts/verify_nh01_democratic_primary.py
      - tests/test_nh01_democratic_primary.py
      - .github/workflows/nh01-primary-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-official-2022-nh-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_nh01_democratic_primary.py
      - name: Download FEC official 2022 workbook
        run: python scripts/download_fec.py --years 2022
      - name: Normalize FEC voting House district records
        run: python scripts/normalize_fec.py --years 2022
      - name: Compare independent NH SOS Democratic primary transcription to FEC
        run: python scripts/verify_nh01_democratic_primary.py
      - uses: actions/upload-artifact@v4
        with:
          name: nh01-democratic-primary-audit
          path: data/processed/nh01_2022_democratic_primary_audit.json
          retention-days: 3
