name: OH-09 2022 Defiance certified primary witness

on:
  pull_request:
    paths:
      - data/sources/oh09_defiance_2022_primary.json
      - scripts/audit_oh09_defiance_primary.py
      - tests/test_oh09_defiance_primary.py
      - .github/workflows/oh09-defiance-primary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-independent-county-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test Defiance certified election vote witness and guard scope
        run: python -m pytest -q tests/test_oh09_defiance_primary.py
      - name: Download official FEC 2022 workbook
        run: python scripts/download_fec.py --years 2022
      - name: Normalize FEC voting House records
        run: python scripts/normalize_fec.py --years 2022
      - name: Compare official Defiance county Primary against FEC baseline
        run: python scripts/audit_oh09_defiance_primary.py
      - uses: actions/upload-artifact@v4
        with:
          name: oh09-defiance-county-primary
          path: data/processed/oh09_defiance_primary_audit.json
          retention-days: 3
