name: OH-09 certified county general canvass

on:
  pull_request:
    paths:
      - data/sources/oh09_2022_official_general_canvass.json
      - scripts/verify_oh09_general_canvass.py
      - tests/test_oh09_general_canvass.py
      - .github/workflows/oh09-general-canvass.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-2022-ohio-canvass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Reconcile all eight county totals in published official canvass
        run: python -m pytest -q tests/test_oh09_general_canvass.py
      - name: Download FEC official 2022 Excel
        run: python scripts/download_fec.py --years 2022
      - name: Normalize the original FEC voting House election records
        run: python scripts/normalize_fec.py --years 2022
      - name: Cross-check the Ohio certified general result against FEC
        run: python scripts/verify_oh09_general_canvass.py
      - uses: actions/upload-artifact@v4
        with:
          name: oh09-general-canvass-audit
          path: data/processed/oh09_2022_general_canvass_audit.json
          retention-days: 3
