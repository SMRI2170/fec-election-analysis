name: OH-09 two certified county primary crosscheck

on:
  pull_request:
    paths:
      - data/sources/oh09_erie_2022_primary.json
      - scripts/audit_oh09_two_county_primary.py
      - tests/test_oh09_two_county_primary.py
      - .github/workflows/oh09-two-county-primary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-2-of-8-oh09-counties:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_oh09_two_county_primary.py
      - run: python scripts/download_fec.py --years 2022
      - run: python scripts/normalize_fec.py --years 2022
      - run: python scripts/audit_oh09_two_county_primary.py
      - uses: actions/upload-artifact@v4
        with:
          name: oh09-two-county-primary-audit
          path: data/processed/oh09_two_county_primary_audit.json
          retention-days: 3
