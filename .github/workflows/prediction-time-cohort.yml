name: Primary-time cohort validity audit

on:
  pull_request:
    paths:
      - scripts/audit_prediction_time_eligibility.py
      - tests/test_prediction_time_eligibility.py
      - docs/prediction-time-cohort.md
      - .github/workflows/prediction-time-cohort.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrospectively-time-separated-fec-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify General data does not influence Primary eligibility
        run: python -m pytest -q tests/test_prediction_time_eligibility.py
      - name: Fetch official four FEC workbooks
        run: python scripts/download_fec.py --years 2016 2018 2020 2022
      - name: Reproduce frozen cohort and all reasons
        run: python scripts/normalize_fec.py --years 2016 2018 2020 2022 --writein-policy attribute
      - name: Verify previously published official-model metrics
        run: |
          python scripts/run_backtests.py --input data/processed/elections.csv --test-years 2018 2020 2022
          python scripts/verify_reproducibility.py
      - name: Separate Primary eligibility from post-General outcome selection
        run: python scripts/audit_prediction_time_eligibility.py --assert-baseline
      - uses: actions/upload-artifact@v4
        with:
          name: primary-time-fec-cohort-eligibility
          path: |
            data/processed/prediction-time-cohort.csv
            data/processed/prediction-time-cohort-summary.json
          retention-days: 7
