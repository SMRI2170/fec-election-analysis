name: FEC Primary/General descriptive relation

on:
  pull_request:
    paths:
      - scripts/analyze_primary_general_relation.py
      - tests/test_primary_general_relation.py
      - docs/primary-general-relationship.md
      - .github/workflows/primary-general-relation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-general-relation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Synthetic tests of the measure, the pre-declared split and the leak checks
        run: python -m pytest -q tests/test_primary_general_relation.py
      - name: Download official FEC 2016-2022 House Excel sources
        run: python scripts/download_fec.py --years 2016 2018 2020 2022
      - name: Normalize fixed 916 voting-House contests
        run: python scripts/normalize_fec.py --years 2016 2018 2020 2022 --writein-policy attribute
      - name: Verify frozen cohort, baseline metrics and source hashes
        run: |
          python scripts/run_backtests.py --input data/processed/elections.csv --test-years 2018 2020 2022
          python scripts/verify_reproducibility.py
      - name: Measure the Primary/General relation on the official data
        run: python scripts/analyze_primary_general_relation.py --input data/processed/elections.csv
      - name: Save short-lived numerical findings and figure
        uses: actions/upload-artifact@v4
        with:
          name: fec-primary-general-relation
          path: |
            data/processed/primary_general/primary_general_summary.csv
            data/processed/primary_general/volume_quintiles.csv
            data/processed/primary_general/primary_general_summary.json
            outputs/figures/primary_general_relation.png
            outputs/figures/primary_general_relation.svg
          retention-days: 7
