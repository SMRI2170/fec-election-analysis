name: FEC report-evidence figure provenance

on:
  pull_request:
    paths:
      - data/sources/report_evidence.json
      - scripts/build_report_figures.py
      - tests/test_report_evidence.py
      - docs/report-evidence-register.md
      - .github/workflows/report-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-report-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check provenance register with synthetic fixture tests
        run: python -m pytest -q tests/test_report_evidence.py
      - name: Download official FEC workbooks
        run: python scripts/download_fec.py --years 2016 2018 2020 2022
      - name: Normalize fixed 916-row House cohort
        run: python scripts/normalize_fec.py --years 2016 2018 2020 2022 --writein-policy attribute
      - name: Verify official source SHA, cohort and out-of-year scores
        run: |
          python scripts/run_backtests.py --input data/processed/elections.csv --test-years 2018 2020 2022
          python scripts/verify_reproducibility.py
      - name: Calculate published error structure with same FEC records
        run: python scripts/analyze_error_structure.py --assert-baseline --iterations 200
      - name: Build MAE chart using only validated FEC results
        run: python scripts/build_report_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: fec-report-evidence-figures
          retention-days: 7
          path: |
            data/processed/report_figures/report_t1_yearly_mae.csv
            data/processed/report_figures/report_f1_yearly_mae.png
            data/processed/report_figures/report_f1_yearly_mae.svg
            data/processed/report_figures/report_figure_manifest.json
